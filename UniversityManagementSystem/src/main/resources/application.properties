spring.application.name=UniversityManagementSystem

spring.datasource.url=
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always
#spring.sql.init.data-locations=classpath:data.sql

spring.data.redis.host=localhost
spring.data.redis.port=6379

razorpay.api.key=
razorpay.api.secret=

# ===================================================================
# AI Configuration (Fast Cloud API / Local Ollama)
# ===================================================================
# Provider options: 'groq' (RECOMMENDED: ~0.3s-0.5s response, 0% Mac RAM/CPU) or 'ollama' (Local)
ai.provider=groq

# Groq Cloud API (100% Free - Get your key in 30 seconds at: https://console.groq.com/keys)
groq.api-key=
groq.base-url=https://api.groq.com/openai/v1
# Fast & lightweight model: openai/gpt-oss-20b (replaces deprecated llama-3.1-8b-instant)
# Smart & comprehensive model: openai/gpt-oss-120b or qwen/qwen3.6-27b (replaces deprecated llama-3.3-70b-versatile)
groq.model=openai/gpt-oss-20b

# Ollama Configuration (Local AI Fallback)
ollama.base-url=http://localhost:11434
ollama.model=llama3.2:3b
